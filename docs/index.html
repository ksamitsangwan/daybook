  if(b.id==="rnext"){reviewStep=Math.min(3,reviewStep+1);render();return}
  if(b.id==="rback"){reviewStep=Math.max(0,reviewStep-1);render();return}
  if(b.id==="rsave"){const k="wk-"+weekStart(today());save("reviews",k,{week:weekStart(today()),top3:reviewDraft.top3.map(s=>s.trim()),note:reviewDraft.note.trim(),savedAt:Date.now()});reviewStep=0;reviewDraft=null;toast("Review saved. Your top 3 is on Today.");setTab("today");return}
  if(b.id==="clear-done"){const cut=Date.now()-30*864e5;tasksArr().filter(t=>t.status==="done"&&(t.doneAt||0)<cut).forEach(t=>removeDoc("tasks",t.id));toast("Old done tasks deleted");return}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(/^r-top\d$/.test(id)&&reviewDraft)reviewDraft.top3[+id.slice(5)]=e.target.value;
  if(id==="r-note"&&reviewDraft)reviewDraft.note=e.target.value;
});
document.addEventListener("change",e=>{const el=e.target;if(!el.dataset)return;
  if(el.dataset.cfg){const st=S.places.get("_settings")||{};save("places","_settings",Object.assign({},st,{[el.dataset.cfg]:el.value.trim()||null}));toast("Claim settings saved");return}
  if(el.dataset.stopf){const[tid,sid,f]=el.dataset.stopf.split("|");let v=el.value.trim();
    if(f==="arrive"||f==="depart"){const p=parseTime(v);if(p===undefined){toast("Type a time like 10:30am or 14:15.");render();return}v=p}
    if(f==="odo"||f==="km"){v=numOrNull(v)}
    if(f==="date"&&!v)v=null;
    jdErr[tid]=null;
    patchStop(tid,sid,{[f]:v});return}
  if(el.dataset.tourf){const[tid,f]=el.dataset.tourf.split("|");let v=el.value.trim();
    if(f==="startTime"||f==="endTime"){const p=parseTime(v);if(!p){toast("Type a time like 9am or 18:30.");render();return}v=p}
    if(f==="startOdo"||f==="endOdo"||f==="kmBack"||f==="kmTotal")v=numOrNull(v);
    if(f==="returnHQ")v=v==="yes";
    if(f==="endDate"&&!v)v=null;
    jdErr[tid]=null;
    const t=Object.assign({},S.tours.get(tid),{[f]:v});
    if(hasNum(t.endOdo)&&hasNum(t.startOdo)&&+t.endOdo<+t.startOdo){toast("End odometer is lower than start. Check the readings.");render();return}
    patch("tours",tid,{[f]:v});return}
});
document.addEventListener("change",e=>{if(e.target.id==="ftask"){T.taskId=e.target.value;saveT()}});
document.addEventListener("submit",e=>{
  if(e.target.id==="auth-form"){e.preventDefault();authSubmit(false);return}
  if(e.target.dataset&&e.target.dataset.addstop){e.preventDefault();const tid=e.target.dataset.addstop,t=S.tours.get(tid);if(!t)return;const f=e.target.elements;const place=f.p.value.trim();if(!place){f.p.focus();return}
    const a=parseTime(f.a.value),l=parseTime(f.l.value);if(a===undefined||l===undefined){toast("Type times like 11am or 14:30.");return}
    const stops=stopsOfTour(t).concat({id:uid(),place,date:f.d.value||t.date,arrive:a,depart:l,acts:[],note:"",odo:numOrNull(f.o.value),km:numOrNull(f.k.value)});
    stops.sort((x,y)=>((x.date||t.date)+(x.arrive||"99:99")).localeCompare((y.date||t.date)+(y.arrive||"99:99")));
    jdErr[tid]=null;patch("tours",tid,{stops});rememberPlace(place);toast("Stop added: "+place);return}
  {const ae=document.activeElement;if(ae&&ae!==document.body&&e.target.contains&&e.target.contains(ae)&&$("#view").contains(ae)&&ae.blur)ae.blur()}
  if(e.target.id==="tour-start"){e.preventDefault();const err=$("#ts-err"),tm=parseTime($("#ts-time").value),odo=numOrNull($("#ts-odo").value);
    if(!tm){err.textContent="Type the start time, like 9am or 09:15.";err.hidden=false;return}
    save("tours",uid(),{date:$("#ts-date").value||today(),startTime:tm,startOdo:odo,from:$("#ts-from").value.trim(),purpose:$("#ts-purpose").value.trim(),type:$("#ts-type").value,mode:$("#ts-mode").value,cls:$("#ts-cls").value,vehicle:$("#ts-veh").value.trim(),stops:[],status:"active",createdAt:Date.now()});toast("Tour started");return}
  if(e.target.id==="stop-add"){e.preventDefault();const at=activeTour();if(!at)return;const place=$("#sa-place").value.trim();if(!place){$("#sa-place").focus();return}
    const tm=parseTime($("#sa-time").value)||nowHM();
    const lf=parseTime((($("#sa-left")||{}).value)||"");const stops=stopsOfTour(at).map((s,i,a)=>i===a.length-1&&!s.depart&&lf?Object.assign({},s,{depart:lf}):s);
    stops.push({id:uid(),place,date:today(),arrive:tm,depart:null,acts:[],note:"",odo:numOrNull(($("#sa-odo")||{}).value),km:numOrNull(($("#sa-km")||{}).value)});
    patch("tours",at.id,{stops});rememberPlace(place);toast("Stop added: "+place);return}
  if(e.target.id==="tour-end"){e.preventDefault();const at=activeTour();if(!at)return;const err=$("#te-err"),tm=parseTime($("#te-time").value),odo=numOrNull($("#te-odo").value);
    if(!tm){err.textContent="Type the end time, like 6pm or 18:10.";err.hidden=false;return}
    if(odo!==null&&hasNum(at.startOdo)&&odo<+at.startOdo){err.textContent=`End reading is lower than the start reading (${at.startOdo}). Check both readings.`;err.hidden=false;return}
    const tl=parseTime((($("#te-left")||{}).value)||"");patch("tours",at.id,{stops:stopsOfTour(at).map((s,i,a)=>i===a.length-1&&!s.depart&&tl?Object.assign({},s,{depart:tl}):s),status:"done",endTime:tm,endOdo:odo,kmBack:numOrNull(($("#te-km")||{}).value),endDate:($("#te-date")||{}).value||today(),returnHQ:(($("#te-hq")||{}).value||"yes")==="yes"});tourMonth=(at.date||today()).slice(0,7);openTours.add(at.id);render();
    {const done=Object.assign({id:at.id},S.tours.get(at.id)),km=tourKm(done),n=tourIssues(done).length;toast("Tour ended"+(km!=null?` · ${km} km`:"")+(n?`. ${n} detail${n===1?"":"s"} still to fill in; you can do it later.`:""))}return}
  if(e.target.dataset&&e.target.dataset.fuform){e.preventDefault();const[tid,sid]=e.target.dataset.fuform.split("|");const t=S.tours.get(tid)||{};const s=stopsOfTour(t).find(x=>x.id===sid);const title=e.target.elements.t.value.trim();if(!title){e.target.elements.t.focus();return}
    save("tasks",uid(),{title,area:"Work",priority:2,due:e.target.elements.d.value||addDays(today(),3),estimate:30,status:"open",createdAt:Date.now(),remindCount:0,tourId:tid,stopId:sid,notes:`Follow-up from tour on ${t.date?prettyDate(t.date):""}${s?" at "+s.place:""}`});
    toast("Follow-up added to Tasks, with reminders");return}
  if(e.target.dataset&&e.target.dataset.actform){e.preventDefault();const[tid,sid]=e.target.dataset.actform.split("|");const a=e.target.elements.a.value.trim();addActFor=null;if(!a){render();return}
    const s=stopsOfTour(S.tours.get(tid)).find(x=>x.id===sid);if(s)patchStop(tid,sid,{acts:[...new Set((s.acts||[]).concat(a))]});
    const st=S.places.get("_settings")||{};if(!ACTS.includes(a)&&!(st.acts||[]).includes(a))save("places","_settings",Object.assign({},st,{acts:(st.acts||[]).concat(a)}));return}
  if(e.target.id==="log-form"){e.preventDefault();const v=$("#log-in").value.trim();if(!v)return;const td=today();const dd=S.days.get(td)||{};
    save("days",td,Object.assign({},dd,{date:td,log:(dd.log||[]).concat(logEntry(v))}));$("#log-in").value="";$("#log-in").blur();toast("Logged");return}
  if(e.target.id==="qa-form"){e.preventDefault();const inp=$("#qa");const v=inp.value.trim();if(!v)return;const p=parseQuick(v,viewDay);if(!p.title){toast("Add a few words describing the task");return}
    save("tasks",uid(),Object.assign(p,{status:"open",createdAt:Date.now(),remindCount:0}));inp.value="";inp.blur();toast("Added for "+relDate(p.due).toLowerCase()+(p.start?" at "+p.start:""));}
  if(e.target.id==="hform"){e.preventDefault();const n=$("#h-name").value.trim();if(!n)return;save("habits",uid(),{name:n,target:+$("#h-target").value,log:{},createdAt:Date.now()});$("#h-name").value="";$("#h-name").blur();toast("Habit added")}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden){$("#sheet").hidden=true;$("#sheet").innerHTML=""}});

$("#import-file").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)importData(f)});
connect();
})();
</script>

</body>
</html>
