<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daybook</title>
<meta name="description" content="Days, tours, follow-ups and habits in one place.">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column, phone-first; a clock-ruled day timeline is the centerpiece, tabs pinned to the bottom like a native app */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E3E8ED; --line:#D3DAE1;
  --fg:#142130; --muted:#5B6878; --accent:#1F5FD6; --accent-ink:#FFFFFF; --accent-soft:#DCE7FB;
  --late:#C8322B; --late-soft:#FBE3E1; --warn:#B26A00; --warn-soft:#FDF0D9; --ok:#1E8A55; --ok-soft:#DDF3E7;
  --p1:#C8322B; --p2:#D98A00; --p3:#8A97A6;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --hour:56px; --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#17202A; --sunk:#1E2934; --line:#2A3743;
  --fg:#E6ECF2; --muted:#93A1B0; --accent:#6C9CFF; --accent-ink:#0B1420; --accent-soft:#1D2D4C;
  --late:#FF6B61; --late-soft:#3A1E1E; --warn:#F2B04A; --warn-soft:#3A2E17; --ok:#4CC98A; --ok-soft:#173327;
  --p1:#FF6B61; --p2:#F2B04A; --p3:#6E7C8B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#17202A; --sunk:#1E2934; --line:#2A3743;
  --fg:#E6ECF2; --muted:#93A1B0; --accent:#6C9CFF; --accent-ink:#0B1420; --accent-soft:#1D2D4C;
  --late:#FF6B61; --late-soft:#3A1E1E; --warn:#F2B04A; --warn-soft:#3A2E17; --ok:#4CC98A; --ok-soft:#173327;
  --p1:#FF6B61; --p2:#F2B04A; --p3:#6E7C8B; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent}
button.small{padding:4px 10px;font-size:.82rem}
button.danger{color:var(--late);border-color:var(--late)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;box-sizing:border-box;min-width:0}
textarea{min-height:64px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

/* Banner */
.banner{background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:var(--r);padding:10px 12px;font-size:.88rem}

/* Stats chips */
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:460px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.chip b{font-family:var(--mono);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip.late b{color:var(--late)}
.chip span{font-size:.75rem;color:var(--muted)}

/* Attention */
.attention{border-color:var(--late);background:linear-gradient(var(--late-soft),var(--late-soft)) top/100% 4px no-repeat,var(--surface)}
.att-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.att-item:first-of-type{border-top:0}
.sev{flex:none;font-family:var(--mono);font-size:.7rem;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--late-soft);color:var(--late);white-space:nowrap}
.sev.warn{background:var(--warn-soft);color:var(--warn)}
.att-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.att-title{font-weight:600;overflow-wrap:anywhere}

/* Quick add */
.qa{display:flex;gap:8px}
.qa input{flex:1}
.hint{font-size:.78rem;color:var(--muted)}
.hint code{font-family:var(--mono);background:var(--sunk);padding:1px 5px;border-radius:5px}

/* Timeline */
.daynav{display:flex;align-items:center;gap:6px}
.load{font-size:.8rem;color:var(--muted)}
.load-bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.load-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.load-bar i.over{background:var(--late)}
.timeline{position:relative;display:grid;grid-template-columns:52px 1fr;max-height:520px;overflow-y:auto;border-top:1px solid var(--line)}
.hours{position:relative}
.hours div{height:var(--hour);font-family:var(--mono);font-size:.7rem;color:var(--muted);transform:translateY(-.55em);padding-right:8px;text-align:right}
.lane{position:relative;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour)),repeating-linear-gradient(to bottom,transparent 0 calc(var(--hour)/2),color-mix(in srgb,var(--line) 45%,transparent) calc(var(--hour)/2) calc(var(--hour)/2 + 1px),transparent calc(var(--hour)/2 + 1px) var(--hour))}
.block{position:absolute;left:4px;right:4px;border-radius:9px;padding:5px 8px;background:var(--accent-soft);border-left:3px solid var(--accent);font-size:.8rem;overflow:hidden;text-align:left;border-top:0;border-right:0;border-bottom:0;display:flex;flex-direction:column;gap:1px;box-sizing:border-box}
.block.done{opacity:.55;text-decoration:line-through}
.block.late{background:var(--late-soft);border-left-color:var(--late)}
.block .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block .m{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--late);z-index:2}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--late)}

/* Task rows */
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--p3);padding:0;background:transparent;display:grid;place-items:center}
.check.p1{border-color:var(--p1)} .check.p2{border-color:var(--p2)}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on::after{content:"";width:9px;height:5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.task-main{flex:1;min-width:0;background:none;border:0;border-radius:6px;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;font-weight:400}
.task-title{overflow-wrap:anywhere}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.meta{font-size:.76rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.meta .late{color:var(--late);font-weight:600}
.tag{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
[hidden]{display:none!important}
.filters button{flex:none;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{color:var(--muted);font-size:.88rem;padding:6px 0}

/* Habits */
.habit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.habit:first-child{border-top:0}
.days{display:flex;gap:5px}
.day{width:30px;height:30px;padding:0;border-radius:8px;font-family:var(--mono);font-size:.66rem;display:grid;place-items:center;background:var(--sunk);border:1px solid transparent;color:var(--muted)}
.day.on{background:var(--ok);color:var(--accent-ink);border-color:var(--ok)}
.day.today{border-color:var(--fg)}
.streak{font-family:var(--mono);font-size:.78rem}
.today-habits{display:flex;gap:8px;flex-wrap:wrap}
.hb{display:flex;align-items:center;gap:6px}
.hb.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

/* Focus */
.timer-wrap{display:grid;place-items:center;padding:10px 0}
.ring{position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .read{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px}
.ring .clock{font-family:var(--mono);font-size:2.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.modes button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Review */
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--sunk)}
.steps i.on{background:var(--accent)}
.top3 ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;border-radius:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Sheet (modal) */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 40%,transparent);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:18px}}

.prog{display:inline-block;width:46px;height:5px;background:var(--sunk);border-radius:9px;overflow:hidden;align-self:center}
.prog i{display:block;height:100%;background:var(--ok);border-radius:9px}
.meta .late{color:var(--late);font-weight:600}
.step-list{padding:0 0 10px 34px;display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:8px;font-size:.9rem;min-height:32px}
.step-check{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--p3);padding:0;background:transparent;display:grid;place-items:center}
.step-check.on{background:var(--ok);border-color:var(--ok)}
.step-check.on::after{content:"";width:8px;height:4px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.step .st{flex:1;min-width:0;overflow-wrap:anywhere}
.step.done .st{text-decoration:line-through;color:var(--muted)}
.sd{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}
.sd.late{color:var(--late);font-weight:600}
.fieldset{display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--muted);min-width:0}
.se-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.se-row .se-title{flex:1 1 160px}
.se-row .se-date{flex:0 0 9.5rem;width:9.5rem}
.se-row button.small{padding:4px 8px}
button:disabled{opacity:.35;cursor:default}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:500}
.chipbtn[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chipbtn.add{border-style:dashed;color:var(--muted)}
.actchips{display:flex;flex-wrap:wrap;gap:6px}
.stops{display:flex;flex-direction:column;gap:10px}
.stop{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg);min-width:0}
.mini{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--muted);min-width:0;flex:1 1 7rem}
.mini input,.mini textarea{font-size:.92rem}
.times{align-items:flex-end}
.fu-add{display:flex;gap:6px;flex-wrap:wrap}
.fu-add input[name=t]{flex:1 1 180px}
.fu-add input[type=date]{flex:0 0 9.5rem;width:9.5rem}
.tourbar{border-color:var(--accent);background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:8px}
.kv b{font-family:var(--mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.tour-row{border-top:1px solid var(--line);padding:8px 0}
.rec{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:6px 10px;font-size:.9rem}
.rec .tm{font-family:var(--mono);color:var(--muted);font-size:.76rem;padding-top:2px;font-variant-numeric:tabular-nums}
.insight{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.trackwrap{overflow-x:auto}
table.track{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
table.track th{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.track td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.track th:first-child,table.track td:first-child{text-align:left}
.evening{border-color:var(--warn)}
.cd-row{display:flex;flex-direction:column;gap:6px;padding:9px 0;border-top:1px solid var(--line)}
.cd-res{font-size:.84rem}
#toast-undo{margin-left:10px;background:transparent;color:inherit;border:1px solid currentColor;padding:3px 10px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.block,.check,.day{transition:background .15s,border-color .15s}}

/* ---------- refresh: app feel ---------- */
:root{--r:16px;--shadow:0 1px 2px rgba(20,33,48,.06),0 6px 18px rgba(20,33,48,.06);--panel-edge:transparent;--hero1:#1C55C7;--hero2:#3F7BEA;--hero-ink:#FFFFFF;--hero-glass:rgba(255,255,255,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:none;--panel-edge:#2A3743;--hero1:#1E3B7A;--hero2:#2C58B0;--hero-ink:#FFFFFF;--hero-glass:rgba(255,255,255,.12)}}
:root[data-theme="dark"]{--shadow:none;--panel-edge:#2A3743;--hero1:#1E3B7A;--hero2:#2C58B0;--hero-ink:#FFFFFF;--hero-glass:rgba(255,255,255,.12)}
body{font-size:16px}
h1{font-size:1.75rem}
section.panel,.chip{border-color:var(--panel-edge);box-shadow:var(--shadow);border-radius:var(--r)}
section.panel{padding:16px}
details.panel{background:var(--surface);border:1px solid var(--panel-edge);box-shadow:var(--shadow);border-radius:var(--r);padding:16px}
input,select,textarea{font-size:16px;min-height:44px;border-radius:12px}
textarea{min-height:72px}
button{min-height:40px}
button.small{min-height:34px}
.mini input,.mini textarea,.mini select{font-size:16px}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:2px 0 12px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
.brand .mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--hero1),var(--hero2));display:grid;place-items:center}
.brand .mark svg{width:16px;height:16px;stroke:var(--hero-ink);fill:none;stroke-width:2.4;stroke-linecap:round}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.hero h1{color:var(--hero-ink)}
.hero .eyebrow{color:var(--hero-ink);opacity:.82}
.hero .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hero .stat{background:var(--hero-glass);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.hero .stat b{font-family:var(--mono);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.hero .stat span{font-size:.72rem;opacity:.88}
.hero .stat.alert{background:var(--surface);color:var(--late)}
@media (max-width:380px){.hero .stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
nav.tabs{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
nav.tabs button{min-height:0;padding:7px 2px 9px}
nav.tabs svg{padding:4px 14px;border-radius:999px;box-sizing:content-box}
nav.tabs button[aria-current="page"] svg{background:var(--accent-soft)}
section.panel.tourbar{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-color:transparent}
.tourbar select,.tourbar input{background:var(--surface);color:var(--fg)}
.tourbar .muted,.tourbar .eyebrow{color:var(--hero-ink);opacity:.85}
.tourbar .mini{color:var(--hero-ink)}
.tourbar button.primary{background:var(--surface);color:var(--accent);border-color:var(--surface)}
</style>
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;color-scheme:light dark}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.wrap{padding-top:calc(14px + env(safe-area-inset-top,0px))}
body.signed-out nav.tabs,body.signed-out .appbar{display:none}
.auth{max-width:420px;margin:10vh auto 0;gap:16px}
.auth form,.auth.panel{background:var(--surface);border:1px solid var(--panel-edge);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
</style>
</head>
<body>

<div class="wrap">
  <header class="appbar"><div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 4h10M3 8h6M3 12h8"/></svg></span>Daybook</div></header>
  <div id="banner" hidden></div>
  <main id="view" class="stack"></main>
</div>

  <button data-tab="habits"><svg viewBox="0 0 24 24"><path d="M12 21c-4-3-8-6-8-11a4 4 0 018-1 4 4 0 018 1c0 5-4 8-8 11z"/></svg>Habits</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
"use strict";
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const today=()=>dkey(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const toMin=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m};
const fromMin=m=>pad(Math.floor(m/60)%24)+":"+pad(m%60);
const fmtDur=m=>m>=60?(Math.floor(m/60)+"h"+(m%60?" "+m%60+"m":"")):m+"m";
// "3pm", "3:30 pm", "15:00", "9" -> "HH:MM"; empty -> null; unreadable -> undefined
function parseTime(str){
  const s=String(str||"").trim().toLowerCase().replace(/\s+/g,"").replace(/\./g,":");
  if(!s)return null;
  const m=s.match(/^(\d{1,2})(?::?(\d{2}))?(am|pm|a|p)?$/);if(!m)return undefined;
  let h=+m[1];const min=m[2]?+m[2]:0,ap=m[3];
  if(min>59)return undefined;
  if(ap){if(h<1||h>12)return undefined;h=h%12+(ap[0]==="p"?12:0)}else if(h>23)return undefined;
  return pad(h)+":"+pad(min);
}
const fmt12=t=>{if(!t)return"";const[h,m]=t.split(":").map(Number);return(h%12||12)+":"+pad(m)+(h<12?" am":" pm")};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const prettyDate=k=>{const d=parseKey(k);return DOW[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]};
const relDate=k=>{if(!k)return"";const t=today();if(k===t)return"Today";if(k===addDays(t,1))return"Tomorrow";if(k===addDays(t,-1))return"Yesterday";return prettyDate(k)};
const weekStart=k=>{const d=parseKey(k);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return dkey(d)};
const AREAS=["Work","Personal","Home","Health","Learning"];
const DAY_START=6*60, DAY_END=24*60;

/* ---------- store: your Supabase database (one "docs" table) with an on-device copy ---------- */
const COLS=["tasks","habits","focus","reviews","templates","tours","places","days"];
const S={tasks:new Map(),habits:new Map(),focus:new Map(),reviews:new Map(),templates:new Map(),tours:new Map(),places:new Map(),days:new Map()};
const CFG=window.DAYBOOK_CONFIG||{};
let db=null,synced=false,sb=null,user=null,channel=null;
const lsKey=c=>"daybook:"+(user?user.id:"anon")+":"+c;
function lsGet(col){try{return JSON.parse(localStorage.getItem(lsKey(col))||"{}")}catch(e){return{}}}
function lsPut(col){try{const o={};S[col].forEach((v,k)=>o[k]=v);localStorage.setItem(lsKey(col),JSON.stringify(o))}catch(e){}}
function loadLocal(){COLS.forEach(c=>{const o=lsGet(c);S[c]=new Map(Object.entries(o))});render()}
async function writeDoc(col,id,data){if(!sb||!user)return;const {error}=await sb.from("docs").upsert({user_id:user.id,col,id,data,updated_at:new Date().toISOString()},{onConflict:"user_id,col,id"});if(error)fail(error)}
async function save(col,id,data){
  if(col==="tasks")data=stampTask(S.tasks.get(id),Object.assign({},data));
  S[col].set(id,data);lsPut(col);render();
  await writeDoc(col,id,data);
}
async function patch(col,id,part){
  const cur=S[col].get(id)||{};
  if(col==="tasks"){const st=stampTask(cur,Object.assign({},cur,part));part=Object.assign({},part,{touchedAt:st.touchedAt});if(st.moveCount!==cur.moveCount)part.moveCount=st.moveCount}
  const next=Object.assign({},cur,part);
  S[col].set(id,next);lsPut(col);render();
  await writeDoc(col,id,next);
}
async function removeDoc(col,id){
  S[col].delete(id);lsPut(col);render();
  if(!sb||!user)return;const {error}=await sb.from("docs").delete().eq("user_id",user.id).eq("col",col).eq("id",id);if(error)fail(error);
}
function fail(e){console.error(e);toast(navigator.onLine===false?"You're offline. That change is kept on this device and will need saving again when you're back online.":"Couldn't save that change. Try again in a moment.")}
function showBanner(msg){const b=$("#banner");b.className="banner";b.textContent=msg;b.hidden=!msg}
async function loadAll(){
  try{
    const m={};COLS.forEach(c=>m[c]=new Map());
    for(let from=0;;from+=1000){const {data,error}=await sb.from("docs").select("col,id,data").eq("user_id",user.id).range(from,from+999);if(error)throw error;
      data.forEach(r=>{if(m[r.col])m[r.col].set(r.id,r.data)});if(data.length<1000)break}
    COLS.forEach(c=>{S[c]=m[c];lsPut(c)});synced=true;showBanner("");render();
  }catch(e){console.error(e);synced=false;showBanner("Can't reach your database right now. Showing the copy saved on this device.");render()}
}
function subscribe(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel("daybook-"+user.id).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"user_id=eq."+user.id},p=>{
    const r=p.eventType==="DELETE"?p.old:p.new;if(!r||!S[r.col])return;
    if(p.eventType==="DELETE")S[r.col].delete(r.id);else S[r.col].set(r.id,r.data);
    lsPut(r.col);render();
  }).subscribe();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&user){loadAll();subscribe()}});

/* ----- sign in ----- */
function signedOutView(html){document.body.classList.add("signed-out");$("#view").innerHTML=html}
function showAuth(msg,mode){
  const recover=mode==="newpass";
  signedOutView(`<div class="auth stack"><div class="brand" style="font-size:2rem"><span class="mark" aria-hidden="true" style="width:40px;height:40px;border-radius:12px"><svg viewBox="0 0 16 16" style="width:22px;height:22px"><path d="M3 4h10M3 8h6M3 12h8"/></svg></span>Daybook</div>
  <div class="muted">${recover?"Choose a new password for your account.":"Your days, tours and follow-ups in one place. Sign in once on each device; everything stays in sync."}</div>
  <form class="panel" id="auth-form" data-mode="${recover?"newpass":"signin"}"><div class="stack" style="gap:10px">
    ${recover?"":`<label class="field">Email<input id="auth-email" type="email" autocomplete="username" required></label>`}
    <label class="field">${recover?"New password":"Password"}<input id="auth-pass" type="password" autocomplete="${recover?"new-password":"current-password"}" minlength="8" required></label>
    <label class="row" style="gap:8px;font-size:.9rem;color:var(--muted)"><input type="checkbox" id="auth-show" style="width:auto;min-height:0"> Show password</label>
    <div id="auth-msg" role="alert" style="color:var(--late);font-size:.88rem">${esc(msg||"")}</div>
    ${recover?`<div class="row"><button class="primary" type="submit">Save new password</button></div>`:
    `<div class="row"><button class="primary" type="submit">Sign in</button><button type="button" id="auth-create">Create account</button></div>
    <div class="row"><button type="button" class="link" id="auth-forgot" style="padding:0;min-height:0;border:0;background:none;color:var(--accent);text-decoration:underline">Forgot password?</button></div>
    <div class="hint">New here? Type your email and a password (8+ characters), then tap Create account and confirm from the email. Check Spam if it doesn't arrive.</div>`}</div></form></div>`);
  $("#auth-show").addEventListener("change",e=>{$("#auth-pass").type=e.target.checked?"text":"password"});
  const f=$("#auth-forgot");if(f)f.addEventListener("click",forgotPassword);
}
const APP_HOME=location.origin+location.pathname;
function authMsg(text,kind){const m=$("#auth-msg");if(!m)return;m.style.color=kind==="ok"?"var(--ok)":kind==="busy"?"var(--muted)":"var(--late)";m.textContent=text}
function authBusy(on){document.querySelectorAll("#auth-form button").forEach(b=>b.disabled=on)}
function friendlyAuthError(m){
  m=String(m||"");
  if(/invalid login/i.test(m))return "Email or password is wrong. New here? Tap Create account first.";
  if(/not confirmed/i.test(m))return "Your email isn't confirmed yet. Open the confirmation email (check Spam) and tap its link, then sign in.";
  if(/already registered|already exists/i.test(m))return "An account with this email already exists. Sign in, or tap Forgot password.";
  if(/rate limit|too many/i.test(m))return "Too many emails sent in the last hour. Wait a while and try again.";
  if(/signups? not allowed|disabled/i.test(m))return "New accounts are switched off for this Daybook.";
  if(/fetch|network|load failed/i.test(m))return "Can't reach the database. Check your internet connection and try again.";
  return m;
}
async function authCall(busyText,fn){
  authMsg(busyText,"busy");authBusy(true);
  const slow=setTimeout(()=>authMsg(busyText+" (still working, this can take up to a minute)","busy"),8000);
  try{return await fn()}catch(e){return{error:e}}finally{clearTimeout(slow);authBusy(false)}
}
async function authSubmit(create){
  const form=$("#auth-form");
  if(form&&form.dataset.mode==="newpass")return saveNewPassword();
  const email=$("#auth-email").value.trim(),password=$("#auth-pass").value;
  if(!email||password.length<8){authMsg("Enter your email and a password of at least 8 characters.");return}
  const {data,error}=await authCall(create?"Creating your account…":"Signing in…",()=>create?sb.auth.signUp({email,password,options:{emailRedirectTo:APP_HOME}}):sb.auth.signInWithPassword({email,password}));
  if(error){authMsg(friendlyAuthError(error.message));return}
  if(create&&!data.session){
    if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length){authMsg(friendlyAuthError("already registered"));return}
    authMsg("Account created. We've emailed "+email+": open it (check Spam), tap the link, then sign in here.","ok");return}
  startSession(data.user);
}
async function forgotPassword(){
  const email=($("#auth-email").value||"").trim();
  if(!email){authMsg("Type your email above first, then tap Forgot password.");return}
  const {error}=await authCall("Sending a reset link…",()=>sb.auth.resetPasswordForEmail(email,{redirectTo:APP_HOME}));
  if(error){authMsg(friendlyAuthError(error.message));return}
  authMsg("If "+email+" has an account, a reset link is on its way (check Spam). Open it on this device.","ok");
}
let recovering=/type=recovery/.test(location.hash);
async function saveNewPassword(){
  const password=$("#auth-pass").value;
  if(password.length<8){authMsg("Use at least 8 characters.");return}
  const {data,error}=await authCall("Saving…",()=>sb.auth.updateUser({password}));
  if(error){authMsg(friendlyAuthError(error.message));return}
  recovering=false;history.replaceState(null,"",APP_HOME);toast("Password changed");startSession(data.user);
}
function startSession(u){if(recovering){showAuth("","newpass");return}if(user&&user.id===u.id)return;user=u;document.body.classList.remove("signed-out");loadLocal();loadAll();subscribe()}
async function connect(){
  if(!window.supabase||!CFG.supabaseUrl||/YOUR_/.test(String(CFG.supabaseUrl)+String(CFG.supabaseAnonKey))){
    signedOutView(`<div class="auth panel"><h2>Almost there</h2><p>This copy of Daybook isn't connected to your database yet. Put your Supabase Project URL and publishable key in <span class="mono">docs/config.js</span>, then reload.</p></div>`);return}
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){recovering=true;setTimeout(()=>showAuth("","newpass"),0);return}
    if(ev==="SIGNED_OUT"){user=null;synced=false;if(channel)sb.removeChannel(channel);COLS.forEach(c=>S[c]=new Map());showAuth()}
    else if(session&&session.user)setTimeout(()=>startSession(session.user),0)});
  const {data}=await sb.auth.getSession();
  if(data.session)startSession(data.session.user);else showAuth();
}
async function importData(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast("That file isn't a Daybook backup.");return}
  const rows=[];COLS.forEach(c=>Object.entries(data[c]||{}).forEach(([id,d])=>rows.push({user_id:user.id,col:c,id,data:d,updated_at:new Date().toISOString()})));
  for(let i=0;i<rows.length;i+=200){const {error}=await sb.from("docs").upsert(rows.slice(i,i+200),{onConflict:"user_id,col,id"});if(error){toast("Import stopped: "+error.message);break}}
  await loadAll();toast("Imported "+rows.length+" items");
}

/* ---------- task helpers ---------- */
const tasksArr=()=>[...S.tasks.entries()].map(([id,t])=>Object.assign({id},t));
function isOverdue(t,now){
  if(t.status==="done"||!t.due)return false;
  const td=today();
  if(t.due<td)return true;
  if(t.due===td){const m=toMin(t.dueTime);if(m!=null&&m<now)return true}
  return false;
}
function overdueLabel(t){
  const td=today();
  if(t.due<td){const days=Math.round((parseKey(td)-parseKey(t.due))/864e5);return days+"d late"}
  const late=nowMin()-toMin(t.dueTime);return late>=60?Math.floor(late/60)+"h late":late+"m late";
}
function sortTasks(a,b){
  const ad=(a.due||"9999")+(a.start||a.dueTime||"99"),bd=(b.due||"9999")+(b.start||b.dueTime||"99");
  return ad<bd?-1:ad>bd?1:(a.priority||3)-(b.priority||3);
}

/* Natural quick add: "Call bank tomorrow 3pm 30m !1 #work" */
function parseQuick(text,baseDay){
  let s=" "+text+" ";const out={area:"Personal",priority:3,due:baseDay||today(),estimate:30};
  s=s.replace(/\s!([123])(?=\s)/,(m,p)=>{out.priority=+p;return" "});
  s=s.replace(/\s#(\w+)(?=\s)/,(m,a)=>{const hit=AREAS.find(x=>x.toLowerCase().startsWith(a.toLowerCase()));out.area=hit||a[0].toUpperCase()+a.slice(1);return" "});
  s=s.replace(/\s(\d+(?:\.\d+)?)\s?(h|hr|hrs|m|min|mins)(?=\s)/i,(m,n,u)=>{out.estimate=Math.round(/^h/i.test(u)?n*60:+n);return" "});
  s=s.replace(/\s(?:at\s)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)(?=\s)/i,(m,h,mm,ap)=>{h=+h%12+(ap.toLowerCase()==="pm"?12:0);out.start=pad(h)+":"+(mm||"00");out.dueTime=out.start;return" "});
  s=s.replace(/\s(?:at\s)?([01]?\d|2[0-3]):([0-5]\d)(?=\s)/,(m,h,mm)=>{out.start=pad(+h)+":"+mm;out.dueTime=out.start;return" "});
  s=s.replace(/\s(today|tonight)(?=\s)/i,()=>{out.due=today();return" "});
  s=s.replace(/\s(tomorrow|tmrw)(?=\s)/i,()=>{out.due=addDays(today(),1);return" "});
  s=s.replace(/\s(?:on\s|next\s)?(mon|tue|wed|thu|fri|sat|sun)[a-z]*(?=\s)/i,(m,d)=>{
    const idx=["sun","mon","tue","wed","thu","fri","sat"].indexOf(d.toLowerCase());
    const cur=new Date().getDay();let diff=(idx-cur+7)%7;if(diff===0)diff=7;out.due=addDays(today(),diff);return" "});
  out.title=s.replace(/\s+/g," ").trim();
  return out;
}

/* ---------- UI state ---------- */
let tab="today";
try{const h=location.hash.slice(1);if(["today","tasks","tour","habits","focus","review"].includes(h))tab=h}catch(e){}
let viewDay=today(), taskFilter="active", reviewStep=0, reviewDraft=null, pendingRender=false;

function setTab(t){tab=t;try{history.replaceState(null,"","#"+t)}catch(e){}render();window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==tab&&["today","tasks","tour","habits","focus","review"].includes(h)){tab=h;render()}});

function render(){
  if(!user)return;
  const v=$("#view");
  if(v.contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){pendingRender=true;return}
  pendingRender=false;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  v.innerHTML=({today:viewToday,tasks:viewTasks,tour:viewTour,habits:viewHabits,focus:viewFocus,review:viewReview})[tab]();
  if(tab==="today")scrollTimeline();
  if(tab==="focus")paintTimer();
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pendingRender)render()},0));

let toastT;function toast(msg,undo,label){
  const t=$("#toast");t.textContent=msg;
  if(undo){const b=document.createElement("button");b.type="button";b.id="toast-undo";b.textContent=label||"Undo";b.onclick=()=>{t.hidden=true;clearTimeout(toastT);undo()};t.append(" ",b)}
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,undo?7000:2600)}
function setDone(id,done){
  const t=S.tasks.get(id);if(!t)return;
  const prev={status:t.status||"open",doneAt:t.doneAt||null};
  patch("tasks",id,{status:done?"done":"open",doneAt:done?Date.now():null});
  toast(done?"Marked done. Reminders stopped.":"Marked not done.",()=>{patch("tasks",id,prev);toast(done?"Back to open.":"Back to done.")});
}

/* ---------- steps ---------- */
let openSteps=new Set();
const stepsOf=t=>Array.isArray(t&&t.steps)?t.steps.map(s=>s.title===undefined&&s.text!==undefined?Object.assign({},s,{title:s.text}):s):[];
const nextStep=t=>t&&t.status!=="done"?stepsOf(t).find(s=>!s.done):null;
function tickNextStep(id){const n=nextStep(S.tasks.get(id));if(n)setStep(id,n.id,true)}
function stepProgress(t){const s=stepsOf(t);return s.length?{done:s.filter(x=>x.done).length,total:s.length}:null}
function lateSteps(t){if(!t||t.status==="done")return[];const td=today();return stepsOf(t).filter(s=>!s.done&&s.due&&s.due<td)}
function stepLate(s){const d=Math.round((parseKey(today())-parseKey(s.due))/864e5);return d+"d late"}
function progressHTML(t){const p=stepProgress(t);if(!p)return"";return`<span class="prog" aria-hidden="true"><i style="width:${Math.round(p.done/p.total*100)}%"></i></span><span>${p.done}/${p.total} steps</span>`}
function setStep(taskId,stepId,done){
  const t=S.tasks.get(taskId);if(!t)return;
  const steps=stepsOf(t).map(s=>s.id===stepId?Object.assign({},s,{done,doneAt:done?Date.now():null}):s);
  patch("tasks",taskId,{steps});
  const n=steps.filter(x=>x.done).length;
  if(done&&n===steps.length&&t.status!=="done")toast(`All ${steps.length} steps done. Mark the task done?`,()=>setDone(taskId,true),"Mark done");
  else if(done)toast(`Step done (${n}/${steps.length}).`,()=>setStep(taskId,stepId,false));
}
function stepListHTML(t){const td=today();return `<div class="step-list">${stepsOf(t).map(s=>{const late=t.status!=="done"&&!s.done&&s.due&&s.due<td;return `<div class="step ${s.done?"done":""}"><button class="step-check ${s.done?"on":""}" data-step="${t.id}|${s.id}" aria-label="${s.done?"Mark step not done":"Mark step done"}: ${esc(s.title)}"></button><span class="st">${esc(s.title)}</span>${s.due?`<span class="sd ${late?"late":""}">${late?esc(stepLate(s)):esc(relDate(s.due))}</span>`:""}</div>`}).join("")}</div>`}
function tplSection(){const tp=[...S.templates.entries()].sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||""));if(!tp.length)return"";return `<section class="panel"><div class="eyebrow">Saved step lists · ${tp.length}</div><div>${tp.map(([id,x])=>`<div class="spread" style="padding:6px 0;border-top:1px solid var(--line)"><span style="min-width:0;overflow-wrap:anywhere">${esc(x.name)} <span class="muted">· ${(x.steps||[]).length} steps</span></span><button class="small ghost" data-deltpl="${id}">Remove</button></div>`).join("")}</div><div class="hint">Add a saved list to any task from its edit form.</div></section>`}


/* ---------- tours, close the day, today's record, track record ---------- */
const STALE_DAYS=5;
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const monthLabel=m=>MONTHS[+m.slice(5,7)-1]+" "+m.slice(0,4);
const addMonth=(m,n)=>{let y=+m.slice(0,4),mo=+m.slice(5,7)+n;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+"-"+pad(mo)};
const nowHM=()=>fromMin(nowMin());
const minOf=ms=>{const d=new Date(ms);return d.getHours()*60+d.getMinutes()};
const fmtClock=ms=>fmt12(fromMin(minOf(ms)));
const dayOf=ms=>dkey(new Date(ms));
const BLOCKERS=["Meetings","Unplanned work","Travel / tour","Waiting on others","Too many tasks","Low energy","Went fine"];
const ACTS=["Outlet inspection","Dealer meeting","Stock & quality check","Safety check","Customer feedback","Sales review","Site survey"];
let openTours=new Set(),addActFor=null,tourMonth=today().slice(0,7);
const toursArr=()=>[...S.tours.entries()].map(([id,t])=>Object.assign({id},t));
const activeTour=()=>toursArr().find(t=>t.status==="active");
const stopsOfTour=t=>Array.isArray(t&&t.stops)?t.stops:[];
const hasNum=v=>v!==null&&v!==undefined&&v!==""&&!isNaN(+v);

function legKms(t){const st=stopsOfTour(t);const pts=[{odo:t.startOdo}].concat(st.map(s=>({odo:s.odo,km:s.km})));if(t.returnHQ!==false&&st.length)pts.push({odo:t.endOdo,km:t.kmBack});const out=[];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];out.push(hasNum(b.km)?Math.round(+b.km*10)/10:(hasNum(a.odo)&&hasNum(b.odo)?Math.round((+b.odo-(+a.odo))*10)/10:null))}return out}
function tourKm(t){if(hasNum(t.kmTotal))return Math.round(+t.kmTotal*10)/10;const l=legKms(t);if(l.length&&l.every(x=>x!==null))return Math.round(l.reduce((a,b)=>a+b,0)*10)/10;return hasNum(t.endOdo)&&hasNum(t.startOdo)?Math.max(0,Math.round((+t.endOdo-(+t.startOdo))*10)/10):null}
function tourIssues(t){if(t.status==="active")return (t.date||"")<today()?[`The tour from ${prettyDate(t.date)} is still running. End it or fill in the end details.`]:[];return journeyLegs(t).problems}
async function saveFile(filename,data){
  const type=/\.xlsx$/i.test(filename)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":/\.json$/i.test(filename)?"application/json":"application/octet-stream";
  const blob=data instanceof Blob?data:new Blob([data],{type});
  try{const f=new File([blob],filename,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return true}}catch(e){if(e&&e.name==="AbortError")return false}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}
  catch(e){toast("Couldn't save the file on this device.");return false}}
const followupsOf=id=>tasksArr().filter(x=>x.tourId===id);
const numOrNull=v=>{v=String(v||"").trim().replace(/[^\d.]/g,"");return v===""?null:+v};
function tourActs(){const s=S.places.get("_settings");return ACTS.concat((s&&s.acts)||[]).filter((a,i,arr)=>arr.indexOf(a)===i)}
function placeNames(){return [...S.places.entries()].filter(([k])=>k[0]!=="_").sort((a,b)=>(b[1].uses||0)-(a[1].uses||0)).map(([,p])=>p.name).filter(Boolean)}
function stampTask(cur,next){next.touchedAt=Date.now();if(cur&&cur.due&&next.due&&next.due>cur.due&&cur.status!=="done")next.moveCount=(cur.moveCount||0)+1;return next}
function staleDays(t){if(t.status==="done")return 0;const last=t.touchedAt||t.createdAt||Date.now();return Math.floor((Date.now()-last)/864e5)}
function isStale(t,now){return t.status!=="done"&&!isOverdue(t,now)&&staleDays(t)>=STALE_DAYS}
function patchStop(tid,sid,part){const t=S.tours.get(tid);if(!t)return;patch("tours",tid,{stops:stopsOfTour(t).map(s=>s.id===sid?Object.assign({},s,part):s)})}
function rememberPlace(name){const n=name.trim();if(!n)return;const hit=[...S.places.entries()].find(([k,p])=>k[0]!=="_"&&(p.name||"").toLowerCase()===n.toLowerCase());if(hit)patch("places",hit[0],{uses:(hit[1].uses||0)+1});else save("places",uid(),{name:n,uses:1})}
function tplFor(title){const tt=(title||"").toLowerCase();if(tt.trim().length<3)return null;return [...S.templates.entries()].find(([,x])=>{const n=(x.name||"").toLowerCase().trim();if(!n)return false;if(tt.includes(n))return true;const w=n.split(/[^a-z0-9&]+/).filter(z=>z.length>=3);return w.length>0&&w.every(z=>tt.includes(z))})||null}
function logEntry(text){const m=text.match(/(\d+(?:\.\d+)?)\s?(hours?|hrs?|h|minutes?|mins?|m)\b/i);const mins=m?Math.round(/^h/i.test(m[2])?m[1]*60:+m[1]):null;return{id:uid(),at:Date.now(),text,mins}}

  h+=`<datalist id="placelist">${placeNames().map(p=>`<option value="${esc(p)}"></option>`).join("")}</datalist>`;

}

async function exportTours(m){
  if(!window.XLSX){await Promise.race([new Promise(res=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=res;document.head.appendChild(s)}),new Promise(res=>setTimeout(res,10000))])}
  if(!window.XLSX){toast("Couldn't load the Excel tool. Check your connection and try again.");return}
  const X=window.XLSX,list=toursArr().filter(t=>t.status==="done"&&(t.date||"").startsWith(m)).sort((a,b)=>((a.date||"")+(a.startTime||"")).localeCompare((b.date||"")+(b.startTime||"")));
  const dmy=k=>k?k.slice(8,10)+"-"+k.slice(5,7)+"-"+k.slice(0,4):"";
  const diary=[["Date","Day","From","Purpose","Start time","Start odometer","Places visited","Activities","End time","End odometer","Km","Follow-ups raised","Follow-ups closed"]];
  let tk=0,tf=0,tc=0;
  list.forEach(t=>{const st=stopsOfTour(t),f=followupsOf(t.id),fc=f.filter(x=>x.status==="done").length,km=tourKm(t);tk+=km||0;tf+=f.length;tc+=fc;
    diary.push([dmy(t.date),DOW[parseKey(t.date).getDay()],t.from||"",t.purpose||"",fmt12(t.startTime),hasNum(t.startOdo)?+t.startOdo:"",st.map(s=>s.place).join("; "),[...new Set(st.flatMap(s=>s.acts||[]))].join("; "),fmt12(t.endTime),hasNum(t.endOdo)?+t.endOdo:"",km??"",f.length,fc])});
  diary.push(["Total","","","","","","","","","",Math.round(tk*10)/10,tf,tc]);
  const detail=[["Date","Stop","Place","Arrived","Left","Minutes there","Odometer","Activities","Observations","Follow-up actions","Follow-up status"]];
  list.forEach(t=>stopsOfTour(t).forEach((s,i)=>{const f=tasksArr().filter(x=>x.stopId===s.id);const mins=s.arrive&&s.depart?toMin(s.depart)-toMin(s.arrive):"";
    detail.push([dmy(t.date),i+1,s.place,fmt12(s.arrive),fmt12(s.depart),mins,hasNum(s.odo)?+s.odo:"",(s.acts||[]).join("; "),s.note||"",f.map(x=>x.title+(x.due?" (by "+dmy(x.due)+")":"")).join("; "),f.map(x=>x.status==="done"?"Done":"Open").join("; ")])}));
  const places=new Set(list.flatMap(t=>stopsOfTour(t).map(s=>(s.place||"").toLowerCase())));
  const summary=[["Tour diary",monthLabel(m)],["Tours",list.length],["Days on tour",new Set(list.map(t=>t.date)).size],["Total km",Math.round(tk*10)/10],["Average km per tour",list.length?Math.round(tk/list.length*10)/10:0],["Stops",list.reduce((a,t)=>a+stopsOfTour(t).length,0)],["Different places",places.size],["Follow-ups raised",tf],["Follow-ups closed",tc],["Follow-ups open",tf-tc]];
  const wb=X.utils.book_new(),sheet=(rows,cols)=>{const ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=cols.map(w=>({wch:w}));return ws};
  X.utils.book_append_sheet(wb,sheet(diary,[11,5,16,28,10,13,36,36,10,13,7,10,10]),"Tour diary");
  X.utils.book_append_sheet(wb,sheet(detail,[11,5,28,10,10,9,11,32,40,44,14]),"Stops");
  X.utils.book_append_sheet(wb,sheet(summary,[22,18]),"Summary");
  const buf=X.write(wb,{bookType:"xlsx",type:"array"});
  if(await saveFile("Tour diary "+monthLabel(m)+".xlsx",new Blob([buf])))toast("Tour diary saved");
}

/* ----- Close the day ----- */
function closeDayPanel(){
  const td=today(),dd=S.days.get(td)||{},hr=new Date().getHours();
  if(dd.closed)return `<section class="panel"><div class="spread"><div><h2>Day closed</h2><div class="muted">${esc(fmtClock(dd.closedAt))} · ${dd.doneCount||0} done · ${dd.moved||0} moved${dd.leftOpen?` · ${dd.leftOpen} left open`:""}</div></div><button class="small" data-closeday="1">Review again</button></div></section>`;
  const open=tasksArr().filter(t=>t.status!=="done"&&t.due&&t.due<=td).length;
  return `<section class="panel ${hr>=17?"evening":""}"><div class="spread"><div style="min-width:0;flex:1 1 220px"><h2>Close the day</h2><div class="muted">${open?`${open} item${open===1?"":"s"} still open for today. Decide each one before you stop.`:"Nothing open for today. Log what you did and set tomorrow's first task."} About 2 minutes.</div></div><button class="${hr>=17?"primary":""}" data-closeday="1">Close the day</button></div></section>`;
}
function openCloseDay(){
  const td=today(),now=nowMin(),dd=S.days.get(td)||{},blk=new Set(dd.blockers||[]);let moved=0;
  const open=tasksArr().filter(t=>t.status!=="done"&&t.due&&t.due<=td).sort(sortTasks);
  const stepsDue=tasksArr().flatMap(t=>t.status==="done"?[]:stepsOf(t).filter(s=>!s.done&&s.due&&s.due<=td).map(s=>({t,s})));
  const sh=$("#sheet");
  sh.innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="cdform" role="dialog" aria-modal="true" aria-labelledby="cd-h">
   <div class="spread"><h2 id="cd-h">Close the day</h2><button type="button" class="small ghost" id="cd-x">Close</button></div>
   <div class="muted">${esc(prettyDate(td))}. Decide every open item so nothing drifts silently.</div>
   <div><div class="eyebrow">Still open · ${open.length}</div>${open.length?open.map(t=>`<div class="cd-row" data-cdt="${t.id}"><div><b>${esc(t.title)}</b> ${t.due<td||isOverdue(t,now)?`<span class="sev">${esc(overdueLabel(t))}</span>`:""}${t.moveCount>=2?` <span class="sev warn">Moved ${t.moveCount}×</span>`:""}</div><div class="row"><button type="button" class="small primary" data-cd="done">Done</button><button type="button" class="small" data-cd="tomorrow">Tomorrow</button><input type="date" class="cd-date" aria-label="Move to another date" style="width:9.5rem;flex:0 0 9.5rem"><button type="button" class="small danger" data-cd="drop">Drop</button></div><div class="cd-res muted" aria-live="polite"></div></div>`).join(""):`<div class="empty">Nothing left open for today.</div>`}</div>
   ${stepsDue.length?`<div><div class="eyebrow">Steps due · ${stepsDue.length}</div>${stepsDue.map(({t,s})=>`<div class="cd-row" data-cds="${t.id}|${s.id}"><div><b>${esc(s.title)}</b> <span class="muted">in ${esc(t.title)}</span></div><div class="row"><button type="button" class="small primary" data-cd="sdone">Step done</button><button type="button" class="small" data-cd="stomorrow">Tomorrow</button></div><div class="cd-res muted" aria-live="polite"></div></div>`).join("")}</div>`:""}
   <div class="fieldset"><span>What got in the way today?</span><div class="actchips">${BLOCKERS.map(b=>`<button type="button" class="chipbtn" aria-pressed="${blk.has(b)}" data-blk="${esc(b)}">${esc(b)}</button>`).join("")}</div></div>
   <label class="field">Anything else you did today? One per line<textarea id="cd-log" placeholder="e.g. Meeting with DRSH on R&amp;R cases 45m"></textarea></label>
   <label class="field">First thing tomorrow<input id="cd-first" autocomplete="off" placeholder="e.g. Call Shah Motors about the estimate"></label>
   <div class="spread"><span></span><div class="row"><button type="button" id="cd-cancel">Cancel</button><button class="primary" type="submit">Close the day</button></div></div>
  </form></div>`;
  sh.hidden=false;
  const close=()=>{sh.hidden=true;sh.innerHTML=""};
  $("#cd-x").onclick=close;$("#cd-cancel").onclick=close;
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});
  const settle=(row,msg)=>{row.querySelector(".cd-res").textContent=msg;row.querySelectorAll("button,input").forEach(x=>x.disabled=true)};
  $("#cdform").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.blk){const on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",String(on));if(on)blk.add(b.dataset.blk);else blk.delete(b.dataset.blk);return}
    const row=b.closest(".cd-row");if(!row||!b.dataset.cd)return;
    if(row.dataset.cdt){const id=row.dataset.cdt;
      if(b.dataset.cd==="done"){patch("tasks",id,{status:"done",doneAt:Date.now()});settle(row,"Done ✓")}
      if(b.dataset.cd==="tomorrow"){patch("tasks",id,{due:addDays(td,1),snoozeUntil:null});moved++;settle(row,"Moved to tomorrow")}
      if(b.dataset.cd==="drop"){removeDoc("tasks",id);settle(row,"Dropped")}}
    if(row.dataset.cds){const[tid,sid]=row.dataset.cds.split("|");const t=S.tasks.get(tid);if(!t)return;
      if(b.dataset.cd==="sdone"){patch("tasks",tid,{steps:stepsOf(t).map(x=>x.id===sid?Object.assign({},x,{done:true,doneAt:Date.now()}):x)});settle(row,"Step done ✓")}
      if(b.dataset.cd==="stomorrow"){patch("tasks",tid,{steps:stepsOf(t).map(x=>x.id===sid?Object.assign({},x,{due:addDays(td,1)}):x)});settle(row,"Step moved to tomorrow")}}
  });
  $("#cdform").addEventListener("change",e=>{if(!e.target.classList.contains("cd-date")||!e.target.value)return;const row=e.target.closest(".cd-row");patch("tasks",row.dataset.cdt,{due:e.target.value,snoozeUntil:null});moved++;settle(row,"Moved to "+relDate(e.target.value).toLowerCase())});
  $("#cdform").onsubmit=e=>{e.preventDefault();
    const lines=$("#cd-log").value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(logEntry);
    const first=$("#cd-first").value.trim();
    if(first)save("tasks",uid(),{title:first,area:"Work",priority:1,due:addDays(td,1),estimate:30,status:"open",createdAt:Date.now(),remindCount:0,notes:"Set as first thing when closing "+prettyDate(td)});
    const left=tasksArr().filter(t=>t.status!=="done"&&t.due&&t.due<=td).length;
    const doneCount=tasksArr().filter(t=>t.status==="done"&&t.doneAt&&dayOf(t.doneAt)===td).length;
    const cur=S.days.get(td)||{};
    save("days",td,Object.assign({},cur,{date:td,closed:true,closedAt:Date.now(),blockers:[...blk],moved:(cur.moved||0)+moved,leftOpen:left,doneCount,log:(cur.log||[]).concat(lines)}));
    close();toast(left?`Day closed. ${left} item${left===1?"":"s"} still open; ${left===1?"it":"they"} will show as overdue tomorrow.`:"Day closed. Nothing left hanging.");
  };
}

/* ----- Today's record ----- */
function recordHTML(){
  const td=today(),ev=[];
  toursArr().filter(t=>t.date===td).forEach(t=>{if(t.startTime)ev.push({m:toMin(t.startTime),txt:`Tour started${t.from?" from "+t.from:""}${hasNum(t.startOdo)?" · odometer "+t.startOdo:""}`});
    stopsOfTour(t).forEach(s=>{if(s.arrive)ev.push({m:toMin(s.arrive),txt:`Reached ${s.place}${(s.acts||[]).length?" · "+s.acts.join(", "):""}`})});
    if(t.status==="done"&&t.endTime)ev.push({m:toMin(t.endTime),txt:`Tour ended · ${tourKm(t)??"–"} km`})});
  tasksArr().forEach(t=>{if(t.status==="done"&&t.doneAt&&dayOf(t.doneAt)===td)ev.push({m:minOf(t.doneAt),txt:"Done: "+t.title});
    stepsOf(t).forEach(s=>{if(s.done&&s.doneAt&&dayOf(s.doneAt)===td)ev.push({m:minOf(s.doneAt),txt:`Step done: ${s.title} (${t.title})`})})});
  ((S.days.get(td)||{}).log||[]).forEach(l=>ev.push({m:minOf(l.at),txt:l.text}));
  ev.sort((a,b)=>a.m-b.m);
  const f=S.focus.get(td);
  return `<section class="panel"><div class="spread"><h2>Today's record</h2><span class="muted" style="font-size:.82rem">${ev.length} entr${ev.length===1?"y":"ies"}${f&&f.minutes?` · ${f.minutes} focus min`:""}</span></div>
   <form id="log-form" class="qa"><input id="log-in" autocomplete="off" placeholder="Log something you did, e.g. Call with DRSH 20m" aria-label="Log an activity"><button type="submit">Log</button></form>
   ${ev.length?`<div class="rec">${ev.map(e=>`<span class="tm">${esc(fmt12(fromMin(e.m)))}</span><span style="overflow-wrap:anywhere">${esc(e.txt)}</span>`).join("")}</div>`:`<div class="empty">Finished tasks, ticked steps, tour stops and anything you log show up here on their own.</div>`}</section>`;
}

/* ----- Track record ----- */
function trackRecordHTML(){
  const td=today(),now=nowMin(),all=tasksArr();
  const rows=[0,1,2,3].map(i=>{const ws=addDays(weekStart(td),-7*i),we=addDays(ws,7),inW=k=>!!k&&k>=ws&&k<we;
    const done=all.filter(t=>t.status==="done"&&t.doneAt&&inW(dayOf(t.doneAt))),withDue=done.filter(t=>t.due),onTime=withDue.filter(t=>dayOf(t.doneAt)<=t.due).length;
    const closed=[...S.days.values()].filter(d=>d.closed&&inW(d.date)).length;
    const elapsed=i===0?Math.min(6,Math.round((parseKey(td)-parseKey(ws))/864e5)+1):6;
    const tours=toursArr().filter(t=>t.status==="done"&&inW(t.date)),km=Math.round(tours.reduce((a,t)=>a+(tourKm(t)||0),0)*10)/10;
    const fus=all.filter(t=>t.tourId&&tours.some(x=>x.id===t.tourId));
    return{ws,done:done.length,onTime:withDue.length?Math.round(onTime/withDue.length*100)+"%":"–",closedN:closed,elapsed,km,fu:`${fus.filter(t=>t.status==="done").length}/${fus.length}`}});
  const ins=[];
  const od=all.filter(t=>isOverdue(t,now)),ls=all.flatMap(t=>lateSteps(t));
  if(od.length||ls.length)ins.push(["now",`${od.length} overdue task${od.length===1?"":"s"}${ls.length?` and ${ls.length} late step${ls.length===1?"":"s"}`:""}`,"Settle them in Close the day: done, a new date, or drop."]);
  const moved=all.filter(t=>t.status!=="done"&&(t.moveCount||0)>=2).sort((a,b)=>b.moveCount-a.moveCount);
  if(moved.length)ins.push(["watch",`Pushed back again and again: ${moved.slice(0,3).map(t=>`${t.title} (${t.moveCount}×)`).join(", ")}`,"Give it a first small step and a time block, or drop it."]);
  const stale=all.filter(t=>isStale(t,now)).sort((a,b)=>staleDays(b)-staleDays(a));
  if(stale.length)ins.push(["watch",`Untouched for ${STALE_DAYS}+ days: ${stale.slice(0,3).map(t=>`${t.title} (${staleDays(t)}d)`).join(", ")}${stale.length>3?` and ${stale.length-3} more`:""}`,"These are the tasks other work pushes aside. Tick a step, schedule it, or drop it."]);
  const fuOpen=all.filter(t=>t.tourId&&t.status!=="done");
  if(fuOpen.length){const oldest=Math.max(...fuOpen.map(t=>Math.floor((Date.now()-(t.createdAt||Date.now()))/864e5)));ins.push(["watch",`${fuOpen.length} tour follow-up${fuOpen.length===1?"":"s"} still open (${oldest?`oldest ${oldest} day${oldest===1?"":"s"}`:"raised today"})`,"Follow-ups are where visits turn into results."])}
  const big=all.filter(t=>t.status!=="done"&&(t.priority===1||(t.estimate||0)>=120)&&!stepsOf(t).length);
  if(big.length)ins.push(["watch",`${big.length} important task${big.length===1?"":"s"} with no steps planned: ${big.slice(0,3).map(t=>t.title).join(", ")}`,"Big tasks without steps are the ones that stall."]);
  const recent=[...S.days.values()].filter(d=>d.closed&&d.date>=addDays(td,-14)),cnt={};
  recent.forEach(d=>(d.blockers||[]).forEach(b=>{if(b!=="Went fine")cnt[b]=(cnt[b]||0)+1}));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  if(top)ins.push(["pattern",`Most common blocker: ${top[0]} (${top[1]} of ${recent.length} closed day${recent.length===1?"":"s"})`,"Plan around it, for example a daily buffer block."]);
  if(rows[0].closedN<rows[0].elapsed)ins.push(["pattern",`Days closed this week: ${rows[0].closedN} of ${rows[0].elapsed}`,"Days you don't close are where tasks start drifting."]);
  const tag={now:["Now",""],watch:["Watch","warn"],pattern:["Pattern","info"]};
  return `<section class="panel"><h2>Track record</h2>
   <div class="trackwrap"><table class="track"><thead><tr><th>Week of</th><th>Tasks done</th><th>On time</th><th>Days closed</th><th>Tour km</th><th>Follow-ups done</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(prettyDate(r.ws).replace(/^\w+, /,""))}</td><td>${r.done}</td><td>${r.onTime}</td><td>${r.closedN}/${r.elapsed}</td><td>${r.km}</td><td>${r.fu}</td></tr>`).join("")}</tbody></table></div>
   <div class="eyebrow" style="margin-top:6px">Where you're slipping</div>
   <div>${ins.length?ins.map(([k,a,b])=>`<div class="insight"><span class="sev ${tag[k][1]==="warn"?"warn":""}" style="${tag[k][1]==="info"?"background:var(--accent-soft);color:var(--accent)":""}">${tag[k][0]}</span><div style="min-width:0"><div style="overflow-wrap:anywhere">${esc(a)}</div><div class="muted" style="font-size:.84rem">${esc(b)}</div></div></div>`).join(""):`<div class="empty">Nothing slipping right now.</div>`}</div></section>`;
}

/* ---------- journey file (office travel-claim template) ---------- */
const JD_CITIES=["Bangalore","Chennai","Delhi","Faridabad","Gurgaon","Hyderabad","IIPM Gurgaon","Kolkata","Mumbai","Noida","Noida - IBP","Noida - R&D","Noida Township","PLHQ Noida","R & D Faridabad","Ahmedabad","Pune","Greater Mumbai","Ghaziabad","Kathmandu,Nepal","Thimphu, Bhutan","Other Cities"];
const JD_MODES=["Auto","Bus","Own Car / Two Wheeler","Flight","Helicopter","Office Car","Others","Ship","Train","Taxi"];
const JD_CLASS=["AC","Non AC"];
let jdErr={};
function claimCfg(){const s=S.places.get("_settings")||{};return{hqName:s.hqName||"HQ",hqCity:s.hqCity||"Other Cities",stopCity:s.stopCity||"Other Cities"}}
function lastTourPrefs(){const l=toursArr().filter(t=>t.mode).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];return{type:(l&&l.type)||"Outstation",mode:(l&&l.mode)||"Own Car / Two Wheeler",cls:(l&&l.cls)||"AC",vehicle:(l&&l.vehicle)||""}}
const dmyDot=k=>k?k.slice(8,10)+"."+k.slice(5,7)+"."+k.slice(0,4):"";
const hms=t=>t?t.replace(":","")+"00":"";
const opts=(list,cur)=>(list.includes(cur)?"":`<option value="" selected>Choose…</option>`)+list.map(x=>`<option ${x===cur?"selected":""}>${esc(x)}</option>`).join("");
function claimFieldsHTML(t){
  return `<div class="grid2">
   <label class="mini">Trip type<select data-tourf="${t.id}|type">${opts(["Outstation","Local"],t.type||"Outstation")}</select></label>
   <label class="mini">Mode of journey<select data-tourf="${t.id}|mode">${opts(JD_MODES,t.mode||"")}</select></label>
   <label class="mini">Class<select data-tourf="${t.id}|cls">${opts(JD_CLASS,t.cls||"AC")}</select></label>
   <label class="mini">Car / train / flight no.<input data-tourf="${t.id}|vehicle" value="${esc(t.vehicle||"")}" placeholder="e.g. PB03AB1234" autocomplete="off"></label></div>`;
}
function journeyLegs(t){
  const c=claimCfg(),st=stopsOfTour(t),P=[],rows=[];
  if((t.type||"Outstation")==="Outstation"){
  if(!t.mode)P.push("Choose the mode of journey.");
  if(!t.cls)P.push("Choose the class (AC or Non AC).");
  if(!String(t.vehicle||"").trim())P.push("Add the car, train or flight number.");}
  if(!st.length)P.push("This tour has no stops.");
  const back=t.returnHQ!==false;
  const pts=[{name:c.hqName,city:c.hqCity,date:t.date,depart:t.startTime,odo:t.startOdo,hq:true}].concat(st.map(s=>({name:s.place,city:c.stopCity,date:s.date||t.date,arrive:s.arrive,depart:s.depart,odo:s.odo,km:s.km})));
  if(back)pts.push({name:c.hqName,city:c.hqCity,date:t.endDate||t.date,arrive:t.endTime,odo:t.endOdo,km:t.kmBack,end:true});
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];
    if(!a.depart)P.push(a.hq?"Add the tour's start time.":`Add the time you left ${a.name}.`);
    if(!b.arrive)P.push(b.end?"Add the tour's end time.":`Add the time you reached ${b.name}.`);
    const km=hasNum(b.km)?Math.round(+b.km*10)/10:(hasNum(a.odo)&&hasNum(b.odo)?Math.round((+b.odo-(+a.odo))*10)/10:null);
    if(km===null)P.push(`Add the km from ${a.hq?"HQ":a.name} to ${b.end?"HQ":b.name} (or odometer readings at both).`);
    if(km!==null&&km<0)P.push(`The odometer goes down between ${a.name} and ${b.name}. Check both readings.`);
    if(a.depart&&b.arrive&&(b.date||"")+b.arrive<(a.date||"")+a.depart)P.push(`Arrival at ${b.name} is before leaving ${a.name}. Check the times or dates.`);
    rows.push([dmyDot(a.date),hms(a.depart),a.city,a.name,dmyDot(b.date),hms(b.arrive),b.city,b.name,b.end?"Yes":"No",km,t.mode||"",t.cls||"",String(t.vehicle||"").trim()]);
  }
  return{rows,problems:[...new Set(P)]};
}
function journeyPreviewHTML(t){
  if((t.type||"Outstation")!=="Outstation")return `<div class="hint">Local tour. Send me your Local template and I'll add its file too. It is never mixed into an outstation claim.</div>`;
  const {rows,problems}=journeyLegs(t),err=jdErr[t.id];
  return `<div class="stack" style="gap:6px"><div class="eyebrow">Journey file · ${rows.length} leg${rows.length===1?"":"s"}${rows.length?` · ${Math.round(rows.reduce((a,r)=>a+(r[9]||0),0)*10)/10} km`:""}</div>
   ${rows.length?`<div class="trackwrap"><table class="track"><thead><tr><th>Date</th><th>From</th><th>Left</th><th>To</th><th>Reached</th><th>Km</th><th>HQ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td style="text-align:left">${esc(r[3])}</td><td>${esc(r[1])}</td><td style="text-align:left">${esc(r[7])}</td><td>${esc(r[5])}</td><td>${r[9]==null?"–":r[9]}</td><td>${esc(r[8])}</td></tr>`).join("")}</tbody></table></div>`:""}

async function loadLib(src,name){if(window[name])return;await Promise.race([new Promise(res=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=res;document.head.appendChild(s)}),new Promise(res=>setTimeout(res,10000))])}
const xmlEsc=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const JD_COLS="ABCDEFGHIJKLM".split("");
async function buildJourneyFile(rows){
  await loadLib("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js","JSZip");
  if(!window.JSZip)throw new Error("zip library unavailable");
  const zip=await window.JSZip.loadAsync(JD_TEMPLATE,{base64:true});
  let sh=await zip.file("xl/worksheets/sheet1.xml").async("string");
  const last=Math.max(26,rows.length+1);
  const tplRow=r=>{const m=sh.match(new RegExp(`<row r="${r}"[^>]*>[\\s\\S]*?</row>`));return m?m[0]:null};
  const out=[tplRow(1)];
  for(let r=2;r<=last;r++){const v=rows[r-2];
    if(v)out.push(`<row r="${r}" spans="1:13">${v.map((x,i)=>{const ref=JD_COLS[i]+r;if(x===null||x===undefined||x==="")return `<c r="${ref}" s="3"/>`;return typeof x==="number"?`<c r="${ref}" s="3"><v>${x}</v></c>`:`<c r="${ref}" s="3" t="inlineStr"><is><t>${xmlEsc(x)}</t></is></c>`}).join("")}</row>`);
    else{const keep=r>=4&&r<=26?tplRow(r):null;out.push(keep||`<row r="${r}" spans="1:13">${JD_COLS.map(c=>`<c r="${c}${r}" s="3"/>`).join("")}</row>`)}}
  sh=sh.replace(/<sheetData>[\s\S]*<\/sheetData>/,`<sheetData>${out.join("")}</sheetData>`).replace(/<dimension ref="[^"]*"\/>/,`<dimension ref="A1:M${last}"/>`);
  if(last>26)sh=sh.replace(/([A-M])2:\1(26)/g,(m0,c)=>`${c}2:${c}${last}`);
  zip.file("xl/worksheets/sheet1.xml",sh);
  if(zip.file("xl/calcChain.xml")){zip.remove("xl/calcChain.xml");
    const ct=await zip.file("[Content_Types].xml").async("string");zip.file("[Content_Types].xml",ct.replace(/<Override[^>]*calcChain[^>]*\/>/,""));
    const rel=await zip.file("xl/_rels/workbook.xml.rels").async("string");zip.file("xl/_rels/workbook.xml.rels",rel.replace(/<Relationship[^>]*calcChain[^>]*\/>/,""))}
  return zip.generateAsync({type:"blob",compression:"DEFLATE",mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

}

/* ---------- HABITS ---------- */
function streakOf(log){let n=0,k=today();if(!log[k])k=addDays(k,-1);while(log[k]){n++;k=addDays(k,-1)}return n}
function viewHabits(){
  const td=today();const days=[];for(let i=6;i>=0;i--)days.push(addDays(td,-i));
  const hs=[...S.habits.entries()];
  let h=`<header class="stack" style="gap:4px"><h1>Habits</h1><div class="muted">Tap a day to tick it off. Streaks count back from today.</div></header>`;
  h+=`<section class="panel">${hs.length?hs.map(([id,x])=>{const log=x.log||{};const wk=days.filter(d=>log[d]).length;const st=streakOf(log);
    return `<div class="habit"><div style="min-width:0"><div style="font-weight:600;overflow-wrap:anywhere">${esc(x.name)}</div><div class="meta"><span class="streak">${st} day streak</span><span>${wk}/${x.target||7} this week</span></div></div>
    <button class="small ghost" data-delhabit="${id}" aria-label="Delete habit ${esc(x.name)}">Remove</button>
    <div class="days" style="grid-column:1/-1">${days.map(d=>`<button class="day ${log[d]?"on":""} ${d===td?"today":""}" data-habit="${id}" data-day="${d}" aria-pressed="${log[d]?"true":"false"}" aria-label="${esc(x.name)} ${esc(prettyDate(d))}">${DOW[parseKey(d).getDay()].slice(0,2)}</button>`).join("")}</div></div>`}).join(""):`<div class="empty">No habits yet. Start with two or three you can do daily, like "Plan tomorrow" or "Walk 20 minutes".</div>`}</section>
  <section class="panel"><h2>Add a habit</h2><form id="hform" class="stack" style="gap:10px"><div class="grid2"><label class="field">Habit<input id="h-name" placeholder="e.g. Read 20 minutes" required></label><label class="field">Days per week<select id="h-target">${[7,6,5,4,3,2,1].map(n=>`<option>${n}</option>`).join("")}</select></label></div><div><button class="primary" type="submit">Add habit</button></div></form></section>`;
  return h;
}

/* ---------- FOCUS ---------- */
const MODES={focus:25,short:5,long:15};
let T=(()=>{try{return JSON.parse(localStorage.getItem("daybook:timer"))||null}catch(e){return null}})()||{mode:"focus",taskId:"",endAt:null,remaining:25*60,running:false};
const saveT=()=>{try{localStorage.setItem("daybook:timer",JSON.stringify(T))}catch(e){}};
function remaining(){return T.running?Math.max(0,Math.round((T.endAt-Date.now())/1000)):T.remaining}
function viewFocus(){
  const open=tasksArr().filter(t=>t.status!=="done").sort(sortTasks);
  const f=S.focus.get(today())||{};
  return `<header class="stack" style="gap:4px"><h1>Focus</h1><div class="muted">${f.minutes||0} minutes and ${f.sessions||0} sessions today.</div></header>
  <section class="panel">
    <div class="modes" role="toolbar" aria-label="Timer length">${Object.entries(MODES).map(([k,m])=>`<button class="small" data-mode="${k}" aria-pressed="${T.mode===k}">${k==="focus"?"Focus "+m:k==="short"?"Break "+m:"Long break "+m}</button>`).join("")}</div>
    <div class="timer-wrap"><div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="none" stroke="var(--sunk)" stroke-width="6"/><circle id="arc" cx="50" cy="50" r="45" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="0"/></svg>
    <div class="read"><div class="clock" id="clock" aria-live="off">25:00</div><div class="eyebrow">${T.mode==="focus"?"Focus":"Break"}</div></div></div></div>
    <label class="field">Working on<select id="ftask"><option value="">No specific task</option>${open.map(t=>`<option value="${t.id}" ${t.id===T.taskId?"selected":""}>${esc(t.title)}</option>`).join("")}</select></label>
    <div class="row" style="justify-content:center"><button class="primary" id="fgo">${T.running?"Pause":remaining()<MODES[T.mode]*60?"Resume":"Start"}</button><button id="freset">Reset</button></div>
  </section>`;
}
function paintTimer(){
  const c=$("#clock"),a=$("#arc");if(!c)return;
  const r=remaining(),tot=MODES[T.mode]*60;
  c.textContent=pad(Math.floor(r/60))+":"+pad(r%60);
  a.setAttribute("stroke-dashoffset",String(282.74*(1-r/tot)));
}
let actx=null;
function chime(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=[660,880,990][i];g.gain.setValueAtTime(.0001,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.35);o.connect(g).connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.4)})}catch(e){}}
async function finishSession(){
  const mode=T.mode,mins=MODES[mode],taskId=T.taskId;
  T.running=false;T.endAt=null;
  T.mode=mode==="focus"?"short":"focus";T.remaining=MODES[T.mode]*60;saveT();
  chime();
  if(mode==="focus"){
    const td=today();const f=Object.assign({minutes:0,sessions:0,byTask:{}},S.focus.get(td)||{});
    f.minutes+=mins;f.sessions+=1;f.byTask=Object.assign({},f.byTask);if(taskId)f.byTask[taskId]=(f.byTask[taskId]||0)+mins;
    await save("focus",td,f);
    if(taskId&&S.tasks.has(taskId))await patch("tasks",taskId,{focusMin:(S.tasks.get(taskId).focusMin||0)+mins});
    toast("Focus session logged. Take a 5 minute break.");
  }else toast("Break over. Ready for the next session?");
  render();
}
setInterval(()=>{if(T.running){if(remaining()<=0)finishSession();else if(tab==="focus")paintTimer()}},500);
setInterval(()=>{if(tab==="today"&&!$("#sheet").innerHTML)render()},60000);

/* ---------- REVIEW ---------- */
function viewReview(){
  const td=today(),ws=weekStart(td),key="wk-"+ws;
  const prev=S.reviews.get(key);
  if(!reviewDraft)reviewDraft={top3:(prev&&prev.top3)||["","",""],note:(prev&&prev.note)||""};
  const steps=["Wins","Clear overdue","Habits","Next week"];
  const all=tasksArr(),now=nowMin();
  const weekAgo=parseKey(addDays(td,-7)).getTime();
  const wins=all.filter(t=>t.status==="done"&&(t.doneAt||0)>=weekAgo);
  const overdue=all.filter(t=>isOverdue(t,now)).sort(sortTasks);
  const lsItems=all.flatMap(t=>lateSteps(t).map(s=>({t,s})));
  const fmins=[...Array(7)].map((_,i)=>(S.focus.get(addDays(td,-i))||{}).minutes||0).reduce((a,b)=>a+b,0);
  let body="";
  if(reviewStep===0){
    body=`<h2>What got done</h2><div class="muted">${wins.length} task${wins.length===1?"":"s"} closed and ${fmins} focus minute${fmins===1?"":"s"} in the last 7 days.</div>
    ${wins.length?`<div>${wins.slice(0,15).map(t=>taskRow(t,now)).join("")}</div><div class="hint">Tap a task to edit it, or its tick to mark it not done.</div>`:`<div class="empty">No closed tasks this week yet. That's useful to know too.</div>`}`;
  }else if(reviewStep===1){
    body=`<h2>Clear what's overdue</h2><div class="muted">Decide each one: do it, move it, or drop it. An overdue list you ignore stops meaning anything.</div>
    ${overdue.length?overdue.map(t=>`<div class="att-item"><span class="sev">${esc(overdueLabel(t))}</span><div class="att-body"><div class="att-title">${esc(t.title)}</div><div class="row"><button class="small primary" data-act="done" data-id="${t.id}">Done</button><button class="small" data-act="nextweek" data-id="${t.id}">Next Monday</button><button class="small" data-act="someday" data-id="${t.id}">No date</button><button class="small danger" data-act="drop" data-id="${t.id}">Drop</button></div></div></div>`).join(""):""}${lsItems.map(({t,s})=>`<div class="att-item"><span class="sev">${esc(stepLate(s))}</span><div class="att-body"><div class="att-title">${esc(s.title)}</div><div class="meta"><span>Step in: ${esc(t.title)}</span></div><div class="row"><button class="small primary" data-step="${t.id}|${s.id}">Step done</button><button class="small" data-stepmove="${t.id}|${s.id}" data-to="nextweek">Next Monday</button><button class="small" data-stepmove="${t.id}|${s.id}" data-to="none">No date</button></div></div></div>`).join("")}${!overdue.length&&!lsItems.length?`<div class="empty">Nothing overdue. Move on.</div>`:""}`;
  }else if(reviewStep===2){
    const hs=[...S.habits.values()];
    body=`<h2>Habits this week</h2>${hs.length?hs.map(x=>{const n=[...Array(7)].filter((_,i)=>x.log&&x.log[addDays(td,-i)]).length;const hit=n>=(x.target||7);return`<div class="spread" style="padding:6px 0;border-top:1px solid var(--line)"><span>${esc(x.name)}</span><span class="sev ${hit?"":"warn"}" style="${hit?"background:var(--ok-soft);color:var(--ok)":""}">${n}/${x.target||7}</span></div>`}).join(""):`<div class="empty">No habits tracked yet. You can add some on the Habits tab.</div>`}`;
  }else{
    body=`<h2>Set next week's top 3</h2><div class="muted">Outcomes, not tasks. These show at the top of Today all week.</div>
    ${[0,1,2].map(i=>`<label class="field">Outcome ${i+1}<input id="r-top${i}" value="${esc(reviewDraft.top3[i]||"")}" placeholder="${["e.g. Ship the Q4 budget draft","e.g. Book the dentist and car service","e.g. Run 3 times"][i]}"></label>`).join("")}
    <label class="field">Note to self<textarea id="r-note" placeholder="What would make next week easier?">${esc(reviewDraft.note)}</textarea></label>`;
  }
  return `<header class="stack" style="gap:4px"><div class="eyebrow">Week of ${esc(prettyDate(ws))}${prev?" · reviewed":""}</div><h1>Weekly review</h1></header>
  ${trackRecordHTML()}
  <div class="steps" aria-hidden="true">${steps.map((_,i)=>`<i class="${i<=reviewStep?"on":""}"></i>`).join("")}</div>
  <div class="eyebrow">Step ${reviewStep+1} of 4 · ${steps[reviewStep]}</div>
  <section class="panel">${body}</section>
  <div class="spread"><button id="rback" ${reviewStep===0?"disabled":""}>Back</button>${reviewStep<3?`<button class="primary" id="rnext">Next</button>`:`<button class="primary" id="rsave">Save review</button>`}</div>`;
}
