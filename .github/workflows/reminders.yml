# Runs the Python reminder service 4 times a day.
# GitHub's clock is UTC: 03:06, 07:06, 12:06, 15:06 UTC = 8:36 am, 12:36 pm, 5:36 pm, 8:36 pm IST.
# (Scheduled runs can start a few minutes late when GitHub is busy.)
name: Daybook reminders

on:
  schedule:
    - cron: "6 3,7,12,15 * * *"
  workflow_dispatch:          # adds a "Run workflow" button for testing
    inputs:
      dry_run:
        description: "Dry run (print only, send nothing)"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Test the reminder logic
        run: python -m pytest -q reminders

      - name: Send reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
          TIMEZONE: Asia/Kolkata
          QUIET_START: "22"
          QUIET_END: "8"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python reminders/reminders.py --dry-run --ignore-quiet
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python reminders/reminders.py --ignore-quiet
          else
            python reminders/reminders.py
          fi
